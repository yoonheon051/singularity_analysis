# push 할 때마다 테스트 실행 — ROS2 두 버전과 같은 OS·Python 조합에서
#   Ubuntu 24.04 + Python 3.12 = ROS2 Jazzy,  Ubuntu 22.04 + Python 3.10 = ROS2 Humble
# - pytest:    ROS 없이 도는 테스트 전부 + 실제 Robotics Toolbox 교차 검증(test_toolbox.py)
# - ros-build: 공식 ROS 컨테이너에서 setup.sh 로 설치·빌드하고, launch 를 띄워 실제로 동작하는지 확인
#              ROS 패키지를 매번 새로 받아 오래 걸리므로(7~25분) PR 과 main 에 들어갈 때(머지)만, 또는 수동 실행 때만 돈다
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.ros }} · Ubuntu ${{ matrix.ubuntu }} · Python ${{ matrix.python }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false      # 한쪽이 실패해도 다른 쪽 결과를 끝까지 봄
      matrix:
        include:
          - { ros: jazzy, ubuntu: '24.04', python: '3.12' }
          - { ros: humble, ubuntu: '22.04', python: '3.10' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest pytest-github-actions-annotate-failures
          pip install xacro || echo "xacro 를 설치하지 못해 그리퍼 xacro 테스트는 건너뜁니다"
      - name: Show versions
        run: python -c "import sys, numpy, roboticstoolbox as rtb; print(sys.version); print('numpy', numpy.__version__, '/ roboticstoolbox', rtb.__version__)"
      - name: Run tests
        run: python -m pytest singularity_analysis/test -v -rs

  ros-build:
    name: setup.sh + launch (${{ matrix.ros }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: ros:${{ matrix.ros }}     # jazzy = Ubuntu 24.04, humble = Ubuntu 22.04
    strategy:
      fail-fast: false
      matrix:
        ros: [jazzy, humble]
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: 셸 스크립트 검사 (shellcheck)
        run: |
          apt-get update -qq && apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S warning setup.sh .github/scripts/*.sh
      - name: setup.sh (사용자와 같은 방식으로 ~/colcon_ws/src 에 두고 실행)
        run: |
          mkdir -p ~/colcon_ws/src
          cp -r "$GITHUB_WORKSPACE" ~/colcon_ws/src/singularity_analysis
          ~/colcon_ws/src/singularity_analysis/setup.sh
      - name: launch 실행 확인 (분석 노드 · 대시보드 · rosbridge)
        run: ~/colcon_ws/src/singularity_analysis/.github/scripts/ros_smoke_test.sh ~/colcon_ws
